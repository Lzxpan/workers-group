<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">打工人集團：可驗證交付流程</title>
  <desc id="svg-desc">從對齊目標、安排分工、最小實作、獨立驗證到誠實交付的五步流程；底部由狀態與所有權、安全記憶、受控改善支撐。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#15213d"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#52d6ff"/>
      <stop offset="100%" stop-color="#8b7dff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#background)"/>
  <rect x="28" y="28" width="1144" height="464" rx="20" fill="none" stroke="#33486e"/>

  <text x="64" y="76" fill="#f4f7ff" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="28" font-weight="700">把複雜任務，變成可交接的成果</text>
  <text x="64" y="104" fill="#b8c5dd" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="16">清楚分工、保存證據、獨立驗證，只交付實際支持的範圍。</text>

  <g font-family="Segoe UI, Microsoft JhengHei, sans-serif">
    <g>
      <rect x="48" y="146" width="188" height="166" rx="16" fill="#151f38" stroke="#3e5c86"/>
      <circle cx="76" cy="178" r="14" fill="#52d6ff"/>
      <text x="100" y="184" fill="#f4f7ff" font-size="21" font-weight="700">對齊目標</text>
      <text x="76" y="222" fill="#b8c5dd" font-size="15">範圍與風險</text>
      <text x="76" y="248" fill="#b8c5dd" font-size="15">先說清楚</text>
    </g>
    <g>
      <rect x="276" y="146" width="188" height="166" rx="16" fill="#151f38" stroke="#3e5c86"/>
      <circle cx="304" cy="178" r="14" fill="#8b7dff"/>
      <text x="328" y="184" fill="#f4f7ff" font-size="21" font-weight="700">安排分工</text>
      <text x="304" y="222" fill="#b8c5dd" font-size="15">角色責任清楚</text>
      <text x="304" y="248" fill="#b8c5dd" font-size="15">避免互相覆寫</text>
    </g>
    <g>
      <rect x="504" y="146" width="188" height="166" rx="16" fill="#151f38" stroke="#3e5c86"/>
      <circle cx="532" cy="178" r="14" fill="#52d6ff"/>
      <text x="556" y="184" fill="#f4f7ff" font-size="21" font-weight="700">最小實作</text>
      <text x="532" y="222" fill="#b8c5dd" font-size="15">保存 evidence</text>
      <text x="532" y="248" fill="#b8c5dd" font-size="15">方便重跑</text>
    </g>
    <g>
      <rect x="732" y="146" width="188" height="166" rx="16" fill="#151f38" stroke="#3e5c86"/>
      <circle cx="760" cy="178" r="14" fill="#8b7dff"/>
      <text x="784" y="184" fill="#f4f7ff" font-size="21" font-weight="700">獨立驗證</text>
      <text x="760" y="222" fill="#b8c5dd" font-size="15">read-only QA</text>
      <text x="760" y="248" fill="#b8c5dd" font-size="15">不自我放行</text>
    </g>
    <g>
      <rect x="960" y="146" width="188" height="166" rx="16" fill="#182a3c" stroke="#52d6ff" stroke-width="2"/>
      <circle cx="988" cy="178" r="14" fill="#70e0aa"/>
      <text x="1012" y="184" fill="#f4f7ff" font-size="21" font-weight="700">誠實交付</text>
      <text x="988" y="222" fill="#d6f9e5" font-size="15" font-weight="700">已驗證範圍</text>
      <text x="988" y="248" fill="#b8c5dd" font-size="15">清楚交接</text>
    </g>
  </g>

  <g fill="none" stroke="url(#highlight)" stroke-width="3" stroke-linecap="round">
    <path d="M 242 229 H 262"/>
    <path d="M 470 229 H 490"/>
    <path d="M 698 229 H 718"/>
    <path d="M 926 229 H 946"/>
  </g>
  <g fill="#8b7dff">
    <path d="M 262 222 L 274 229 L 262 236 Z"/>
    <path d="M 490 222 L 502 229 L 490 236 Z"/>
    <path d="M 718 222 L 730 229 L 718 236 Z"/>
    <path d="M 946 222 L 958 229 L 946 236 Z"/>
  </g>

  <rect x="64" y="352" width="1072" height="2" fill="url(#highlight)"/>
  <text x="64" y="386" fill="#b8c5dd" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="15">持續支撐交付品質</text>
  <g font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="17" font-weight="600">
    <rect x="64" y="408" width="306" height="48" rx="24" fill="#1b2948" stroke="#3e5c86"/>
    <text x="217" y="439" text-anchor="middle" fill="#dbe9ff">狀態與所有權</text>
    <rect x="447" y="408" width="306" height="48" rx="24" fill="#1b2948" stroke="#3e5c86"/>
    <text x="600" y="439" text-anchor="middle" fill="#dbe9ff">安全記憶</text>
    <rect x="830" y="408" width="306" height="48" rx="24" fill="#1b2948" stroke="#3e5c86"/>
    <text x="983" y="439" text-anchor="middle" fill="#dbe9ff">受控改善</text>
  </g>
</svg>

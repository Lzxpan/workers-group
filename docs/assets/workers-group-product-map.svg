<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">打工人集團的工作主視覺</title>
  <desc id="desc">四張深藍色卡片依序呈現目標、團隊、推進與成果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071628"/><stop offset="1" stop-color="#0c2740"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#39c8ff"/><stop offset="1" stop-color="#6e8cff"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#ffcb6b"/><stop offset="1" stop-color="#ff8a4c"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#010713" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <circle cx="110" cy="90" r="190" fill="#1a8fc8" opacity=".1"/><circle cx="1110" cy="650" r="250" fill="#f59a4f" opacity=".08"/>
  <g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
    <text x="70" y="82" fill="#9bdfff" font-size="24" font-weight="700" letter-spacing="3">打工人集團</text>
    <text x="70" y="140" fill="#fff" font-size="42" font-weight="800">把大任務交給一個可靠團隊</text>
    <text x="70" y="180" fill="#b8c9d9" font-size="21">一句話開始，剩下的交給打工人集團。</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="248" width="246" height="330" rx="22" fill="#102d48" stroke="#2d6081"/>
    <rect x="342" y="248" width="246" height="330" rx="22" fill="#102d48" stroke="#2d6081"/>
    <rect x="614" y="248" width="246" height="330" rx="22" fill="#102d48" stroke="#2d6081"/>
    <rect x="886" y="248" width="246" height="330" rx="22" fill="#172b3c" stroke="#c58c4f"/>
  </g>
  <g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
    <circle cx="112" cy="291" r="22" fill="url(#blue)"/><text x="105" y="299" fill="#062038" font-size="22" font-weight="800">1</text>
    <text x="103" y="365" fill="#fff" font-size="27" font-weight="800">告訴我們目標</text>
    <text x="103" y="410" fill="#c4d4df" font-size="18">從你的想法開始</text>
    <path d="M105 455h175" stroke="#3f738f"/><circle cx="191" cy="504" r="40" fill="none" stroke="#69dcff" stroke-width="4"/><path d="M174 504h34m-17-17v34" stroke="#69dcff" stroke-width="4" stroke-linecap="round"/>

    <circle cx="384" cy="291" r="22" fill="url(#blue)"/><text x="377" y="299" fill="#062038" font-size="22" font-weight="800">2</text>
    <text x="375" y="365" fill="#fff" font-size="27" font-weight="800">團隊開始工作</text>
    <text x="375" y="410" fill="#c4d4df" font-size="18">每件事有人照顧</text>
    <path d="M383 479c12-24 44-24 56 0m-28-28v48m34-20c12-24 44-24 56 0m-28-28v48" fill="none" stroke="#9bdfff" stroke-width="4" stroke-linecap="round"/>

    <circle cx="656" cy="291" r="22" fill="url(#blue)"/><text x="649" y="299" fill="#062038" font-size="22" font-weight="800">3</text>
    <text x="647" y="365" fill="#fff" font-size="27" font-weight="800">全程有人照看</text>
    <text x="647" y="410" fill="#c4d4df" font-size="18">複雜的事不再失焦</text>
    <path d="M668 495l20 20 48-54" fill="none" stroke="#6fe1c2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="928" cy="291" r="22" fill="url(#gold)"/><text x="921" y="299" fill="#3a2108" font-size="22" font-weight="800">4</text>
    <text x="919" y="365" fill="#fff" font-size="25" font-weight="800">清楚地回到你手上</text>
    <text x="919" y="410" fill="#d8e0e5" font-size="18">你隨時知道下一步</text>
    <path d="M944 462h105v84h-105zM964 490h65M964 514h48" fill="none" stroke="#ffc76d" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path d="M316 413h26m0 0-11-11m11 11-11 11M588 413h26m0 0-11-11m11 11-11 11M860 413h26m0 0-11-11m11 11-11 11" stroke="#5abce6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="70" y="625" width="1062" height="48" rx="15" fill="#102e43" stroke="#24566d"/>
  <text x="600" y="657" text-anchor="middle" fill="#d7f4ff" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="700">你掌握方向；團隊陪你把事情做好。</text>
</svg>

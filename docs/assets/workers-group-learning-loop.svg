<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">打工人集團會越做越順</title>
  <desc id="desc">三張卡片呈現一起想辦法、記住有用做法與下次做得更好的產品價值。</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#081a2d"/><stop offset="1" stop-color="#12364b"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#4fd3ff"/><stop offset="1" stop-color="#7f8cff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#010711" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1200" height="500" rx="30" fill="url(#background)"/>
  <g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
    <text x="70" y="75" fill="#fff" font-size="38" font-weight="800">做得久，也會越來越順</text>
    <text x="70" y="114" fill="#b9d3df" font-size="20">遇到難題、累積經驗，下一次就少繞一點路。</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="166" width="326" height="260" rx="22" fill="#10314a" stroke="#347c9f"/>
    <rect x="437" y="166" width="326" height="260" rx="22" fill="#10314a" stroke="#347c9f"/>
    <rect x="804" y="166" width="326" height="260" rx="22" fill="#173344" stroke="#b88754"/>
  </g>
  <g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
    <circle cx="113" cy="211" r="23" fill="url(#accent)"/><path d="M103 211h20M113 201v20" stroke="#082238" stroke-width="4" stroke-linecap="round"/>
    <text x="103" y="276" fill="#fff" font-size="25" font-weight="800">遇到問題，一起想辦法</text>
    <text x="103" y="324" fill="#d3e4ec" font-size="18">需要多想一步時，</text><text x="103" y="354" fill="#d3e4ec" font-size="18">不必只靠一個人硬撐。</text>

    <circle cx="480" cy="211" r="23" fill="url(#accent)"/><path d="M470 201h20v20h-20zM475 208h10M475 214h10" fill="none" stroke="#082238" stroke-width="3" stroke-linecap="round"/>
    <text x="470" y="276" fill="#fff" font-size="25" font-weight="800">記住有用的做法</text>
    <text x="470" y="324" fill="#d3e4ec" font-size="18">相似任務再出現時，</text><text x="470" y="354" fill="#d3e4ec" font-size="18">可以更快找到起點。</text>

    <circle cx="847" cy="211" r="23" fill="#ffbf67"/><path d="M837 215l8 8 15-18" fill="none" stroke="#39220a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="837" y="276" fill="#fff" font-size="25" font-weight="800">把下一次做得更好</text>
    <text x="837" y="324" fill="#e3e8eb" font-size="18">每一次完成的任務，</text><text x="837" y="354" fill="#e3e8eb" font-size="18">都讓合作更順手。</text>
  </g>
</svg>
